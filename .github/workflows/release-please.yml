name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  # release:published does not fire for releases created by GITHUB_TOKEN.
  # Dispatch npm-publish.yml so staging uses the trusted-publisher workflow
  # filename configured on npmjs.com (not this file).
  trigger-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch npm-publish for ${{ needs.release-please.outputs.tag_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run npm-publish.yml \
            --repo "${{ github.repository }}" \
            -f ref="${{ needs.release-please.outputs.tag_name }}"
