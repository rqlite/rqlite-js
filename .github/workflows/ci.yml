name: CI

on:
  push:
    # Prefer main; keep master until the GitHub default branch is flipped.
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - name: Build (supported tsdown Node)
        if: matrix.node-version != 20
        run: npm run build && npm run test-build && npm run check-pack
      - name: Build with Node 24 for Node 20 runtime
        if: matrix.node-version == 20
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Produce dist on Node 24
        if: matrix.node-version == 20
        run: npm ci && npm run build
      - name: Restore Node 20 for runtime test of dist
        if: matrix.node-version == 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Test on Node 20 after build
        if: matrix.node-version == 20
        run: npm run test-build

  integrations:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and run integration tests (3-node cluster)
        run: ./bin/rqlite-cluster.sh test
