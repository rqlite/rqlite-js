name: npm-publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Full verify (lint, types, unit, build)
        run: npm run verify
      - name: Integration tests against rqlite
        run: |
          docker compose -p rqlitejs build
          docker compose -p rqlitejs run --rm test
          docker compose -p rqlitejs down
      - name: Stage package on npm
        # Staged publish: CI uploads via OIDC; a maintainer must approve with 2FA
        # (npmjs.com Staged Packages, or `npm stage approve <id>`) before it goes live.
        run: npm stage publish
