name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to stage (tag or branch)
        required: true
        default: v3.0.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Full verify (lint, types, unit, build)
        run: npm run verify
      - name: Integration tests against rqlite cluster
        run: ./bin/rqlite-cluster.sh test
      - name: Stage package on npm
        # Staged publish: CI uploads via OIDC; a maintainer must approve with 2FA
        # (npmjs.com Staged Packages, or `npm stage approve <id>`) before it goes live.
        run: npm stage publish
